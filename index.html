<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatroom</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="login-screen" class="screen">
    <div class="login-card">
      <div class="logo">
        <span class="logo-icon">💬</span>
        <h1>Chatroom</h1>
      </div>
      <p class="login-subtitle">Real-time chat, hosted on GitHub Pages</p>
      <form id="login-form">
        <label for="username-input">Your name</label>
        <input
          type="text"
          id="username-input"
          placeholder="Enter a display name"
          maxlength="24"
          autocomplete="off"
          required
        />
        <label for="room-input">Room</label>
        <input
          type="text"
          id="room-input"
          placeholder="general"
          maxlength="32"
          autocomplete="off"
        />
        <button type="submit" class="btn-primary">Join chat</button>
      </form>
    </div>
  </div>

  <div id="chat-screen" class="screen hidden">
    <header class="chat-header">
      <div class="header-left">
        <span class="room-badge" id="room-badge">#general</span>
        <span class="online-count" id="online-count">0 online</span>
      </div>
      <div class="header-right">
        <span class="user-label" id="user-label"></span>
        <button id="leave-btn" class="btn-ghost" title="Leave room">Leave</button>
      </div>
    </header>

    <main class="chat-main">
      <ul id="messages" class="messages" aria-live="polite"></ul>
    </main>

    <footer class="chat-footer">
      <form id="message-form">
        <input
          type="text"
          id="message-input"
          placeholder="Type a message…"
          maxlength="500"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn-send" aria-label="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gun/sea.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
